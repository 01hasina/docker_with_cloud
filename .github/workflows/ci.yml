# nommer le workflow
name: build and push docker image

# donner les conditions de déclenchement du workflow
on:
  push:
    branches:
      - main

# définir les jobs du workflow (ce qu'il doit faire), job veut dire tâche

jobs:
  build:
    # spécifier l'environnement d'exécution du job
    runs-on: ubuntu-latest
    # définir les étapes du job
    steps:
      - name: Checkout code
        #   utiliser une action pour récupérer le code du dépôt sur la machine virtuelle où le workflow s'exécute
        uses: actions/checkout@v4

      - name: Login to DockerHub
        #   uitliser une action pour se connecter à DockerHub en utilisant les secrets définis dans le dépôt
        uses: docker/login-action@v3
        with:
          # ne jamais mettre mes identifiants en clair dans le code, utiliser les secrets pour les stocker de manière sécurisée
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build  Docker image
        run: docker build -t hasina17/docker_with_cloud:latest .

      - name: push Docker image
        run: docker push hasina17/docker_with_cloud:latest
  deploy:
    runs-on: self-hosted
    #le deploiement a besoin du job pour etre executé avant lui
    needs: build
    steps:
      - name: pull image
        run: docker pull hasina17/docker_with_cloud:latest
      - name: stop old container
        shell: bash
        run: docker stop hasina17/docker_with_cloud || true
      - name: run new container
        run: docker run -d -p 8080:80 --name docker_with_cloud hasina17/docker_with_cloud:latest